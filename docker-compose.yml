version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: ai_roadmap_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ai_academic_roadmap

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_roadmap_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DATABASE=ai_academic_roadmap
    depends_on:
      - mongodb
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_roadmap_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongodb_data:
